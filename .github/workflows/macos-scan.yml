name: Run Psalm (mac OS)

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
      with:
        php-version: '8.5'
        ini-values: zend.assertions=1, assert.exception=1, opcache.enable_cli=1, opcache.jit=off
        tools: composer:v2
        coverage: none
      env:
        fail-fast: true

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest
      env:
        COMPOSER_ROOT_VERSION: dev-master

    - name: Run Psalm
      #run: ./psalm --output-format=github --force-jit
      run: ./psalm --output-format=github
