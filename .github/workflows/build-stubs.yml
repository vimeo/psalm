name: Build docker image for stubs

# A newer push cancels a running build, except on master and 6.x: there it waits, so
# that a build of a busy branch finishes and caches its slow extension layers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/6.x' }}

# Branch pushes only: tags and releases never build the stub images (a
# `branches` filter on `push` excludes tag pushes).
on:
  push:
    branches:
      - '**'
  # dispatched by bin/ci/apply-queued-changes.php after merging, which doesn't trigger pushes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre_job:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      versions: ${{ steps.versions.outputs.versions }}
      tag_suffix: ${{ steps.tag.outputs.suffix }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          cancel_others: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/6.x' }}
          do_not_skip: '["release"]'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          coverage: none

      # The PHP version matrix is derived from the single VERSIONS constant in the build script.
      - id: versions
        run: echo "versions=$(php bin/stubs/build_docker.php --versions)" >> "$GITHUB_OUTPUT"

      # Canonical builds (the default branch, tags and releases) push the shared
      # internal_stubs_<version> tag; every other branch gets a branch-scoped tag
      # so concurrent branches never clobber each other's images.
      - id: tag
        env:
          IS_CANONICAL: ${{ github.event_name == 'release' || github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$IS_CANONICAL" = "true" ]; then
            suffix=""
          else
            suffix="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

  build-stubs-docker:
    permissions:
      contents: read
      packages: write
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # A failure for one PHP version must not cancel the others, so every
      # version that does build still gets pushed.
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.pre_job.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          coverage: none

      # composer/semver matches the PHP version against the PIE packages' constraints
      - name: Install dependencies
        env:
          COMPOSER_ROOT_VERSION: dev-master
        run: |
          composer update --no-install
          composer install --no-dev

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push docker image
        env:
          ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_SUFFIX: ${{ needs.pre_job.outputs.tag_suffix }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          php bin/stubs/build_docker.php ${{ matrix.version }}

  composer-build:
    permissions:
      contents: read
      packages: read
    needs: [pre_job, build-stubs-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        env:
          COMPOSER_ROOT_VERSION: dev-master
        run: |
          composer update --no-install
          composer install -o

      # Regenerate the callmaps (from the images built above) and everything else
      # `composer build` produces, and fail if any committed file is now out of
      # date - writing the changes to a patch that is uploaded as an artifact so
      # they can be applied locally with `git apply composer-build.patch`.
      - name: Run composer build and check for a diff
        env:
          STUBS_IMAGE_OWNER: ${{ github.repository_owner }}
          STUBS_IMAGE_TAG_SUFFIX: ${{ needs.pre_job.outputs.tag_suffix }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          composer build
          if ! git diff --quiet; then
            git diff > composer-build.patch
            echo "::error::composer build produced uncommitted changes. Apply it from the repo root with: bin/ci/apply-composer-build-patch.sh"
            exit 1
          fi

      - name: Upload patch
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composer-build-patch
          path: composer-build.patch
          if-no-files-found: ignore
