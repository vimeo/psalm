name: Perf comment

# Posts the sticky perf report with a write token, so it never checks out or runs PR code.
# The `perf-report` artifact is untrusted: validated, passed via files/env; only pr_number, head_sha, the `verdict` enum and report.md are used.

on:
  workflow_run:
    workflows: [Perf]
    types: [completed]

permissions:
  pull-requests: write # create/update the sticky comment
  actions: read # download the artifact of the triggering run

concurrency:
  group: perf-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  comment:
    name: Upsert PR comment
    # "failure" is the normal fail verdict and must still be posted; cancelled runs post nothing.
    if: >-
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch') &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-report
          path: ${{ runner.temp }}/perf-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate report and build comment
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          dir="$RUNNER_TEMP/perf-report"
          marker='<!-- psalm-perf-report -->'
          comment="$RUNNER_TEMP/comment.md"
          skip() { echo "::notice title=Perf comment::$1"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }
          ready() { echo "ready=true" >> "$GITHUB_OUTPUT"; echo "pr_number=$1" >> "$GITHUB_OUTPUT"; exit 0; }

          # No report: post a constant message, only on the open PR matching the run's commit and repository.
          if [ ! -f "$dir/report.md" ]; then
            [[ "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || skip "Triggering run has no valid head sha."
            pr_number=$(
              gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" -f state=open -f head="${RUN_HEAD_OWNER}:${RUN_HEAD_BRANCH}" \
                | jq -r --arg sha "$RUN_HEAD_SHA" --arg repo "$RUN_HEAD_REPO" \
                  '[.[] | select(.head.sha == $sha and .head.repo.full_name == $repo) | .number][0] // empty'
            )
            [[ "$pr_number" =~ ^[0-9]{1,9}$ ]] || skip "No report, and no open PR has head ${RUN_HEAD_SHA}."
            # shellcheck disable=SC2016
            { echo "$marker"; printf 'Perf report unavailable for `%s`, see the [workflow run](%s).\n' "${RUN_HEAD_SHA:0:12}" "$RUN_URL"; } > "$comment"
            ready "$pr_number"
          fi

          # Untrusted: accept only exact shapes.
          pr_number=$(head -c 20 "$dir/pr_number" 2>/dev/null || true)
          report_sha=$(head -c 64 "$dir/head_sha" 2>/dev/null || true)
          [[ "$pr_number" =~ ^[0-9]{1,9}$ ]] || skip "Artifact has no valid pr_number."
          [[ "$report_sha" =~ ^[0-9a-f]{40}$ ]] || skip "Artifact has no valid head_sha."
          [[ "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || skip "Triggering run has no valid head sha."
          # A manual run's head_sha is the default branch, so it is checked only against the PR's current head below.
          if [ "$RUN_EVENT" != workflow_dispatch ]; then
            [ "$report_sha" = "$RUN_HEAD_SHA" ] || skip "Artifact head_sha does not match the triggering run."
          fi

          # The PR must still point at the measured commit from the same repository.
          IFS=$'\t' read -r pr_head pr_repo < <(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '[.head.sha, (.head.repo.full_name // "")] | @tsv'
          )
          [ "$pr_head" = "$report_sha" ] || skip "PR #${pr_number} moved on to ${pr_head}, ignoring stale report."
          if [ "$RUN_EVENT" != workflow_dispatch ]; then
            [ "$pr_repo" = "$RUN_HEAD_REPO" ] || skip "PR #${pr_number} head repository does not match the triggering run."
          fi

          verdict=$(jq -r '.verdict // empty' "$dir/summary.json" 2>/dev/null || true)
          case "$verdict" in pass | warn | fail) ;; *) verdict=unknown ;; esac

          # Neutralise @ mentions (zero width space); reports over 60000 bytes become a constant text (GitHub's limit is 65536).
          zwsp=$(printf '\342\200\213')
          { echo "$marker"; iconv -f UTF-8 -t UTF-8 -c < "$dir/report.md" | sed "s/@/@${zwsp}/g"; } > "$comment"
          if [ "$(wc -c < "$comment")" -gt 60000 ]; then
            {
              echo "$marker"
              # shellcheck disable=SC2016
              printf 'Perf report for `%s`: **%s**. The report is too large for a comment, see the [workflow run](%s).\n' \
                "${report_sha:0:12}" "$verdict" "$RUN_URL"
            } > "$comment"
          fi

          ready "$pr_number"

      - name: Upsert sticky comment
        if: steps.build.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.build.outputs.pr_number }}
        run: |
          comment_id=$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- psalm-perf-report -->"))) | .id' \
              | sed -n '1p'
          )
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -F body=@"$RUNNER_TEMP/comment.md" --silent
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@"$RUNNER_TEMP/comment.md" --silent
          fi
