name: Build docker image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - 6.x
    tags:
      - '*'
  # dispatched on the tags of the releases bin/ci/auto-release.php publishes, which don't trigger tag pushes, and
  # by bin/ci/apply-queued-changes.php after merging, which doesn't trigger branch pushes either
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre_job:
    permissions:
      actions: write
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          cancel_others: true
          skip_after_successful_duplicate: false
          do_not_skip: '["release", "workflow_dispatch"]'
          # list files that may affect or are included into the built phar
          paths: '[".github/**", "bin/**", "assets/**", "build/**", "dictionaries/**", "resources/**", "src/**", "stubs/**", "psalm", "psalm-language-server", "psalm-plugin", "psalm-refactor", "psalm-review", "psalter", "box.json.dist", "composer.json", "config.xsd", "keys.asc.gpg", "scoper.inc.php"]'

  build-docker:
    permissions:
      packages: write
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ${{ matrix.image }}
    strategy:
      matrix:
        image:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0 # required for composer to automatically detect root package version

      - name: Get Composer Cache Directories
        id: composer-cache
        run: |
          echo "files_cache=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
          echo "vcs_cache=$(composer config cache-vcs-dir)" >> $GITHUB_OUTPUT

      - name: Generate composer.lock
        run: |
          composer update --no-install

      - name: Cache composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ${{ steps.composer-cache.outputs.files_cache }}
            ${{ steps.composer-cache.outputs.vcs_cache }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Run composer install
        run: composer install -o
          # DO NOT set this, we need composer to figure out the version itself
          # env:
          #   COMPOSER_ROOT_VERSION: dev-master

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Upload docker image
        env:
          REF: ${{ github.ref }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/psalm
          PLATFORM: ${{ matrix.image }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          php bin/ci/build-docker.php

      # GITHUB_TOKEN can't write to another organization's packages
      - name: Upload docker image to ghcr.io/psalm
        if: ${{ github.repository == 'vimeo/psalm' }}
        env:
          REF: ${{ github.ref }}
          IMAGE: ghcr.io/psalm/psalm
          PLATFORM: ${{ matrix.image }}
          GHCR_TOKEN: ${{ secrets.PSALM_GHCR_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          php bin/ci/build-docker.php

  merge-docker:
    permissions:
      packages: write
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Upload final docker image
        env:
          REF: ${{ github.ref }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/psalm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          php bin/ci/push-docker.php

      - name: Upload final docker image to ghcr.io/psalm
        if: ${{ github.repository == 'vimeo/psalm' }}
        env:
          REF: ${{ github.ref }}
          IMAGE: ghcr.io/psalm/psalm
          GHCR_TOKEN: ${{ secrets.PSALM_GHCR_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          php bin/ci/push-docker.php
